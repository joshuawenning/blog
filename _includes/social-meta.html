{% assign social_title = site.title | append: " · " | append: page.title %}
{% assign social_description = page.description | default: site.description %}
{% assign social_image = '/assets/images/preview.jpg' | absolute_url %}
<meta name="description" content="{{ social_description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ social_title }}">
<meta property="og:description" content="{{ social_description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ social_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@joshuawenning">
<meta name="twitter:title" content="{{ social_title }}">
<meta name="twitter:description" content="{{ social_description }}">
<meta name="twitter:image" content="{{ social_image }}">
<meta name="twitter:image:alt" content="{{ site.title }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "sameAs": [
    "{{ site.social.x }}",
    "{{ site.social.linkedin }}"
  ]
}
</script>
