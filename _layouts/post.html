---
layout: default
---

<section class="post mb-2">
  <h1 class="text-h2">{{ page.title }}</h1>
  <h2 class="text-h6 grey mb-1 text-normal text-tracked text-uppercase">{{ page.date | date: "%B %d, %Y" }} {% include status.html status=page.status inline=true %}</h2>
  <div class="post-body container-sm lh-copy">
    {{ content }}
  </div>
  <a href="/blog">&larrhk;&#xFE0E; Back to posts</a>
</section>
